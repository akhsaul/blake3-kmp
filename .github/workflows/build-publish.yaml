name: build-test-publish

permissions:
  contents: read

on:
  pull_request: { }
  workflow_dispatch: { }
  push:
    tags:
      - 'v*'

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"
  ZIG_VERSION: "0.16.0"
  JDK_VERSION: "25"
  JDK_VENDOR: "jetbrains"

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: ${{ env.JDK_VENDOR }}
          java-version: ${{ env.JDK_VERSION }}

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: build binary with zig
        run: |
          zig build jvm -p src/jvmMain/resources/jni
          cp -R src/jvmMain/resources/jni/* ../blake3-ffm/src/main/resources/jni/
          zig build android -p src/androidMain/jniLibs
          mkdir -p src/androidMain/resources/native-host
          cp -R src/jvmMain/resources/jni/aarch64 src/androidMain/resources/native-host/
          cp -R src/jvmMain/resources/jni/amd64 src/androidMain/resources/native-host/
          find src/androidMain/resources/native-host -name "libblake3-kmp.so" -exec sh -c 'mv "$1" "$1.bin"' _ {} \;
        working-directory: blake3-kmp

      - name: check all files
        run: |
          ls -lRh blake3-kmp/src/androidMain/jniLibs

          find blake3-kmp/src/jvmMain/resources/jni -name "*.pdb" -type f -delete
          find blake3-kmp/src/jvmMain/resources/jni -name "*.lib" -type f -delete
          ls -lRh blake3-kmp/src/jvmMain/resources/jni

          find blake3-kmp/src/androidMain/resources/native-host -name "libblake3-kmp.so" -exec sh -c 'mv "$1" "$1.bin"' _ {} \;
          find blake3-kmp/src/androidMain/resources/native-host -name "*.pdb" -type f -delete
          find blake3-kmp/src/androidMain/resources/native-host -name "*.lib" -type f -delete
          ls -lRh blake3-kmp/src/androidMain/resources/native-host

          find blake3-ffm/src/main/resources/jni -name "*.pdb" -type f -delete
          find blake3-ffm/src/main/resources/jni -name "*.lib" -type f -delete
          ls -lRh blake3-ffm/src/main/resources/jni

      - uses: actions/upload-artifact@v7
        with:
          name: blake3-kmp-jvm-binary
          path: blake3-kmp/src/jvmMain/resources/jni
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: blake3-kmp-android-binary
          path: blake3-kmp/src/androidMain/jniLibs
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: blake3-ffm-jvm-binary
          path: blake3-ffm/src/main/resources/jni
          if-no-files-found: error

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: ${{ env.JDK_VENDOR }}
          java-version: ${{ env.JDK_VERSION }}

      - name: Ensure Android SDK location property
        run: |
          if [ -d "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          elif [ -d "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          else
            mkdir -p /tmp/android-sdk
            echo "sdk.dir=/tmp/android-sdk" > local.properties
          fi

      - name: Static checks
        run: ./gradlew spotlessCheck check -x testAndroid -x testAndroidHostTest -x jvmTest -x androidConnectedCheck -x test

  binary-test-distribution:
    runs-on: ubuntu-latest
    needs:
      - build-binaries
      - static-checks
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/download-artifact@v7
        with:
          name: blake3-kmp-jvm-binary
          path: blake3-kmp/src/jvmMain/resources/jni

      - uses: actions/download-artifact@v7
        with:
          name: blake3-ffm-jvm-binary
          path: blake3-ffm/src/main/resources/jni

      - uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: ${{ env.JDK_VENDOR }}
          java-version: ${{ env.JDK_VERSION }}

      - name: package jvm test as archive for later use
        run: |
          ./gradlew :blake3-kmp:installJvmTestDistribution
          ./gradlew :blake3-ffm:installTestDistribution

      - uses: actions/upload-artifact@v7
        with:
          name: blake3-kmp-binary-tests
          path: blake3-kmp/build/install/jvmTest
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: blake3-ffm-binary-tests
          path: blake3-ffm/build/install/test
          if-no-files-found: error

  jvm-platform-test:
    needs:
      - binary-test-distribution
    strategy:
      fail-fast: true
      matrix:
        platform:
          - os: macOS-15-intel
            native-target: macosX64
          - os: macOS-15
            native-target: macosArm64
          - os: ubuntu-24.04
            native-target: linuxX64
          - os: ubuntu-24.04-arm
            native-target: linuxArm64
          - os: windows-2025
            native-target: mingwX64
          - os: windows-11-arm
            native-target: mingwArm64
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: ${{ env.JDK_VENDOR }}
          java-version: ${{ env.JDK_VERSION }}

      - uses: actions/download-artifact@v7
        with:
          name: blake3-kmp-binary-tests
          path: blake3-kmp-dist

      - uses: actions/download-artifact@v7
        with:
          name: blake3-ffm-binary-tests
          path: blake3-ffm-dist

      - name: Run JVM tests
        shell: bash
        run: |
          chmod +x blake3-kmp-dist/bin/blake3-kmp-test || true
          blake3-kmp-dist/bin/blake3-kmp-test

          chmod +x blake3-ffm-dist/bin/blake3-ffm-test || true
          JAVA_OPTS="--enable-native-access=ALL-UNNAMED" blake3-ffm-dist/bin/blake3-ffm-test

  android-test:
    needs:
      - binary-test-distribution
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            api-level: '27'
            system-images: default
            arch: x86
          - os: ubuntu-latest
            api-level: '36' # 37.0 still has bug (adb can't connect) for reactivecircus/android-emulator-runner@v2
            system-images: google_apis_ps16k
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: ${{ env.JDK_VENDOR }}
          java-version: ${{ env.JDK_VERSION }}

      - uses: actions/download-artifact@v7
        with:
          name: blake3-kmp-android-binary
          path: blake3-kmp/src/androidMain/jniLibs

      - run: |
          ls -lRh src/androidMain/jniLibs
        working-directory: blake3-kmp

      - name: Enable KVM on Linux (for Android Emulator)
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.system-images }}-${{ matrix.arch }}

      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.system-images }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-boot-timeout: 300
          emulator-options: -no-window -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: run android test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.system-images }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-boot-timeout: 300
          emulator-options: -no-snapshot-save -no-window -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew ":blake3-kmp:assembleAndroidDeviceTest" ":blake3-kmp:connectedAndroidDeviceTest"

      - uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.api-level }}-${{ matrix.arch }}
          path: |
            **/build/reports/tests/**
            **/build/reports/androidTests/connected/**
          retention-days: 1

  android-host-test:
    runs-on: ubuntu-latest
    needs:
      - build-binaries
      - static-checks
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/download-artifact@v7
        with:
          name: blake3-kmp-jvm-binary
          path: blake3-kmp/src/jvmMain/resources/jni

      - uses: actions/download-artifact@v7
        with:
          name: blake3-kmp-android-binary
          path: blake3-kmp/src/androidMain/jniLibs

      - name: reconstruct android native-host from jvm binary
        run: |
          mkdir -p blake3-kmp/src/androidMain/resources/native-host
          cp -R blake3-kmp/src/jvmMain/resources/jni/aarch64 blake3-kmp/src/androidMain/resources/native-host/
          cp -R blake3-kmp/src/jvmMain/resources/jni/amd64 blake3-kmp/src/androidMain/resources/native-host/
          find blake3-kmp/src/androidMain/resources/native-host -name "libblake3-kmp.so" -exec sh -c 'mv "$1" "$1.bin"' _ {} \;
          ls -lRh blake3-kmp/src/androidMain/resources/native-host

      - uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: ${{ env.JDK_VENDOR }}
          java-version: ${{ env.JDK_VERSION }}

      - name: Ensure Android SDK location property
        run: |
          if [ -d "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          elif [ -d "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          else
            mkdir -p /tmp/android-sdk
            echo "sdk.dir=/tmp/android-sdk" > local.properties
          fi

      - name: run android host tests (no manual native setup)
        run: ./gradlew :blake3-kmp:testAndroidHostTest :blake3-kmp:testAndroid

  publish:
    needs:
      - jvm-platform-test
      - android-test
      - android-host-test
      - static-checks
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check
        run: |
          results=$(tr -d '\n' <<< '${{ toJSON(needs.*.result) }}')
          if ! grep -q -v -E '(failure|cancelled)' <<< "$results"; then
            echo "One or more required jobs failed"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: ${{ env.JDK_VENDOR }}
          java-version: ${{ env.JDK_VERSION }}

      - uses: actions/download-artifact@v7
        with:
          name: blake3-kmp-jvm-binary
          path: blake3-kmp/src/jvmMain/resources/jni

      - uses: actions/download-artifact@v7
        with:
          name: blake3-kmp-android-binary
          path: blake3-kmp/src/androidMain/jniLibs

      - uses: actions/download-artifact@v7
        with:
          name: blake3-ffm-jvm-binary
          path: blake3-ffm/src/main/resources/jni

      - name: reconstruct android native-host from jvm binary
        run: |
          mkdir -p blake3-kmp/src/androidMain/resources/native-host
          cp -R blake3-kmp/src/jvmMain/resources/jni/aarch64 blake3-kmp/src/androidMain/resources/native-host/
          cp -R blake3-kmp/src/jvmMain/resources/jni/amd64 blake3-kmp/src/androidMain/resources/native-host/
          find blake3-kmp/src/androidMain/resources/native-host -name "libblake3-kmp.so" -exec sh -c 'mv "$1" "$1.bin"' _ {} \;
          ls -lRh blake3-kmp/src/androidMain/resources/native-host

      - name: generate library to maven local
        run: ./gradlew publishToMavenLocal

      - name: verify published AAR contents
        run: |
          AAR_DIR=~/.m2/repository/com/akhsaul/blake3
          echo "published AARs:"
          find "$AAR_DIR" -name "*.aar" | sort
          REL=$(find "$AAR_DIR/blake3-kmp-android" -name "*.aar" | head -1)
          [ -n "$REL" ] || { echo "ERROR: missing android AAR"; exit 1; }
          echo "android AAR: $REL"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -l "$REL" | grep "jni/$abi/libblake3-kmp.so" || { echo "ERROR: AAR missing $abi"; exit 1; }
          done
          TMP=$(mktemp -d)
          unzip -q -o "$REL" classes.jar -d "$TMP"
          # Linux .so is stored as .so.bin (AGP strips *.so from classes.jar).
          for f in native-host/aarch64/libblake3-kmp.so.bin native-host/amd64/libblake3-kmp.so.bin native-host/aarch64/libblake3-kmp.dylib native-host/amd64/libblake3-kmp.dylib; do
            unzip -l "$TMP/classes.jar" | grep "$f" || { echo "ERROR: classes.jar missing $f"; exit 1; }
          done
          rm -rf "$TMP"
          echo "AAR verification passed"

      - uses: actions/upload-artifact@v7
        with:
          name: blake3-kmp-published-library
          path: ~/.m2/repository/com/akhsaul/blake3
          if-no-files-found: error

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          generate_release_notes: true
          files: |
            ~/.m2/repository/com/akhsaul/blake3/**/*.jar
            ~/.m2/repository/com/akhsaul/blake3/**/*.aar
            ~/.m2/repository/com/akhsaul/blake3/**/*.pom
            ~/.m2/repository/com/akhsaul/blake3/**/*.module

  publish-github-packages:
    needs:
      - jvm-platform-test
      - android-test
      - android-host-test
      - static-checks
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JDK_VENDOR }}
          java-version: ${{ env.JDK_VERSION }}

      - uses: actions/download-artifact@v7
        with:
          name: blake3-kmp-jvm-binary
          path: blake3-kmp/src/jvmMain/resources/jni

      - uses: actions/download-artifact@v7
        with:
          name: blake3-kmp-android-binary
          path: blake3-kmp/src/androidMain/jniLibs

      - uses: actions/download-artifact@v7
        with:
          name: blake3-ffm-jvm-binary
          path: blake3-ffm/src/main/resources/jni

      - name: reconstruct android native-host from jvm binary
        run: |
          mkdir -p blake3-kmp/src/androidMain/resources/native-host
          cp -R blake3-kmp/src/jvmMain/resources/jni/aarch64 blake3-kmp/src/androidMain/resources/native-host/
          cp -R blake3-kmp/src/jvmMain/resources/jni/amd64 blake3-kmp/src/androidMain/resources/native-host/
          find blake3-kmp/src/androidMain/resources/native-host -name "libblake3-kmp.so" -exec sh -c 'mv "$1" "$1.bin"' _ {} \;
          ls -lRh blake3-kmp/src/androidMain/resources/native-host

      - name: Publish to GitHub Packages
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
