[versions]
agp = "9.3.1"
compileSdk = "37"
minSdk = "27"
kotlin = "2.3.21"
androidx-runner = "1.7.0"
androidx-junit = "1.3.0"
maven-publish = "0.37.0"
spotless = "8.9.0"
testDistribution = "0.3.0"

[libraries]
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
mavenPublish-gradle-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish" }
testDistributionGradlePlugin = { module = "com.jakewharton.gradle:test-distribution-gradle-plugin", version.ref = "testDistribution" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
