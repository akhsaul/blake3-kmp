name: build

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches:
      - 'main'
      - 'feature/*'
    tags:
      - '**'

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  native-test-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: false

      - run: |
          zig build -p src/jvmMain/resources/jni
          zig build -p src/androidMain/jniLibs
          ls -la src/jvmMain/resources/jni
        working-directory: blake3-kmp

      - uses: actions/upload-artifact@v7
        with:
          name: blake3-kmp-native-tests
          path: blake3-kmp/src/jvmMain/resources/jni
          if-no-files-found: error

  static-checks:
    runs-on: ubuntu-latest
    needs:
      - native-test-binaries
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Ensure Android SDK location property
        run: |
          if [ -d "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          elif [ -d "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          else
            mkdir -p /tmp/android-sdk
            echo "sdk.dir=/tmp/android-sdk" > local.properties
          fi

      - name: Static checks
        run: ./gradlew check -x testAndroid -x testAndroidHostTest -x jvmTest -x androidConnectedCheck

  jvm-test-binaries:
    runs-on: ubuntu-latest
    needs:
      - static-checks
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: false

      - run: zig build -p src/jvmMain/resources/jni
        working-directory: blake3-kmp

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - run: ./gradlew :blake3-kmp:installJvmTestDistribution

      - uses: actions/upload-artifact@v7
        with:
          name: jni-binaries
          path: blake3-kmp/src/jvmMain/resources/jni
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: blake3-kmp-jvm-tests
          path: blake3-kmp/build/install/jvmTest
          if-no-files-found: error

  platform-test:
    needs:
      - jvm-test-binaries
      - native-test-binaries
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macOS-15
            native-target: macosArm64
          - os: ubuntu-24.04
            native-target: linuxX64
          - os: ubuntu-24.04-arm
            native-target: linuxArm64
          - os: windows-2025
            native-target: mingwX64

    runs-on: ${{ matrix.platform.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - uses: actions/download-artifact@v7
        with:
          name: blake3-kmp-jvm-tests

      - uses: actions/download-artifact@v7
        if: matrix.platform.native-target != 'skip'
        with:
          name: blake3-kmp-native-tests

      - name: Run JVM tests
        run: |
          chmod +x bin/blake3-kmp-test || true
          bin/blake3-kmp-test

      - name: Run native tests
        if: matrix.platform.native-target != 'skip'
        shell: bash
        run: |
          chmod +x ${{ matrix.platform.native-target }}/debugTest/test.*
          ${{ matrix.platform.native-target }}/debugTest/test.*

  android-test:
    runs-on: ubuntu-latest
    needs:
      - jvm-test-binaries
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: false

      - run: zig build -p src/androidMain/jniLibs
        working-directory: blake3-kmp

      - name: Enable KVM (for Android test)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          emulator-boot-timeout: 20000
          script: ./gradlew assembleAndroidTest

  final-status:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs:
      - platform-test
      - android-test
      - static-checks
    steps:
      - name: Check
        run: |
          results=$(tr -d '\n' <<< '${{ toJSON(needs.*.result) }}')
          if ! grep -q -v -E '(failure|cancelled)' <<< "$results"; then
            echo "One or more required jobs failed"
            exit 1
          fi

  publish:
    needs:
      - final-status
    runs-on: macos-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: false

      - run: |
          zig build -p src/jvmMain/resources/jni
          zig build -p src/androidMain/jniLibs
        working-directory: blake3-kmp

      - run: ./gradlew publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
